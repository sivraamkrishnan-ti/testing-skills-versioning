# .github/workflows/sync-expert.yml
#
# Copy this file into YOUR GitHub repo under .github/workflows/
#
# This workflow syncs your repository's system_prompt.md and skills/ directory
# to your Braintrust Expert whenever you push to main.
#
# ── Required secrets ──────────────────────────────────────────────────────────
# Go to: GitHub repo → Settings → Secrets and variables → Actions → New repository secret
#
#   BRAINTRUST_API_KEY  — your Braintrust API key
#                         (Braintrust UI → Settings → API Keys → Create)
#
#   BRAINTRUST_AGENT_ID — your Expert's agent ID
#                         (copy from the Expert's URL in Braintrust:
#                          .../experts/<AGENT_ID>)
#
# ── Repo structure ────────────────────────────────────────────────────────────
#
#   system_prompt.md          ← system prompt text (optional — omit to leave unchanged)
#   skills/
#     my-skill/               ← one directory per skill
#       script.py
#       README.md
#     another-skill/
#       handler.py
#
# ── Behaviour ─────────────────────────────────────────────────────────────────
#   • Triggers on push to main when system_prompt.md or skills/** change
#   • Can also be triggered manually from the Actions tab (workflow_dispatch)
#   • If system_prompt.md exists → updates the Expert's system prompt (2 calls)
#   • If skills/ contains directories → replaces ALL Expert skills (1 call)
#   • Fields absent from the repo are left unchanged in Braintrust
# ─────────────────────────────────────────────────────────────────────────────

name: Sync to Braintrust Expert

on:
  push:
    branches: [main]
    paths:
      - 'system_prompt.md'
      - 'skills/**'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build payloads and sync to Braintrust
        env:
          BRAINTRUST_API_KEY: ${{ secrets.BRAINTRUST_API_KEY }}
          BRAINTRUST_AGENT_ID: ${{ secrets.BRAINTRUST_AGENT_ID }}
        run: |
          # ── Build combined result JSON ──────────────────────────────────────
          node -e "
            const fs   = require('fs');
            const path = require('path');
            const out  = { prompt: null, skills: null };

            if (fs.existsSync('system_prompt.md')) {
              out.prompt = fs.readFileSync('system_prompt.md', 'utf8');
            }

            const skillsDir = 'skills';
            if (fs.existsSync(skillsDir)) {
              const skills = [];

              const listFilesRecursively = (rootDir) => {
                const files = [];
                const walk = (currentDir, relativePrefix) => {
                  relativePrefix = relativePrefix || '';
                  const entries = fs.readdirSync(currentDir, { withFileTypes: true })
                    .sort((a, b) => a.name.localeCompare(b.name));
                  for (const entry of entries) {
                    const entryPath    = path.join(currentDir, entry.name);
                    const relativePath = relativePrefix
                      ? path.posix.join(relativePrefix, entry.name)
                      : entry.name;
                    if (entry.isDirectory()) { walk(entryPath, relativePath); continue; }
                    if (!entry.isFile()) continue;
                    files.push({ filepath: entryPath, filename: relativePath });
                  }
                };
                walk(rootDir);
                return files;
              };

              for (const skillName of fs.readdirSync(skillsDir).sort()) {
                const skillPath = path.join(skillsDir, skillName);
                if (!fs.statSync(skillPath).isDirectory()) continue;
                const files = [];
                for (const fileEntry of listFilesRecursively(skillPath)) {
                  const content = fs.readFileSync(fileEntry.filepath).toString('base64');
                  const ext     = path.extname(fileEntry.filename).toLowerCase();
                  const CONTENT_TYPES = {
                    '.py': 'text/x-python', '.md': 'text/markdown',
                    '.json': 'application/json', '.yaml': 'application/x-yaml',
                    '.yml': 'application/x-yaml', '.txt': 'text/plain',
                    '.js': 'text/javascript', '.ts': 'application/typescript',
                    '.sh': 'text/x-sh', '.toml': 'application/toml',
                    '.csv': 'text/csv', '.html': 'text/html', '.xml': 'application/xml',
                  };
                  files.push({
                    name: fileEntry.filename,
                    content,
                    contentType: CONTENT_TYPES[ext] || 'application/octet-stream',
                    encoding: 'base64',
                  });
                }
                if (files.length > 0) skills.push({ name: skillName, files });
              }
              if (skills.length > 0) out.skills = skills;
            }

            if (!out.prompt && !out.skills) {
              console.error('ERROR: Nothing to sync — add system_prompt.md and/or a skills/ directory.');
              process.exit(1);
            }
            process.stdout.write(JSON.stringify(out));
          " > /tmp/braintrust_sync_result.json

          HAS_PROMPT=$(node -e "const d=JSON.parse(require('fs').readFileSync('/tmp/braintrust_sync_result.json','utf8')); process.stdout.write(d.prompt !== null ? 'true' : 'false')")
          HAS_SKILLS=$(node -e "const d=JSON.parse(require('fs').readFileSync('/tmp/braintrust_sync_result.json','utf8')); process.stdout.write(d.skills !== null ? 'true' : 'false')")

          # ── Call 1 + 2: GET current agent → PUT prompt ──────────────────────
          if [ "$HAS_PROMPT" = "true" ]; then
            echo "Fetching current agent state..."
            curl -s \
              "https://braintrust.ti.trilogy.com/api/agents/$BRAINTRUST_AGENT_ID" \
              -H "x-api-key: $BRAINTRUST_API_KEY" > /tmp/braintrust_agent.json

            node -e "
              const fs     = require('fs');
              const result = JSON.parse(fs.readFileSync('/tmp/braintrust_sync_result.json','utf8'));
              const agent  = JSON.parse(fs.readFileSync('/tmp/braintrust_agent.json','utf8'));
              const body   = { prompt: result.prompt };
              if (agent.syncedDriveFolderId) body.syncedDriveFolderId = agent.syncedDriveFolderId;
              process.stdout.write(JSON.stringify(body));
            " > /tmp/braintrust_prompt_payload.json

            echo "Updating system prompt..."
            HTTP_STATUS=$(curl -s -o /tmp/braintrust_prompt_response.json -w "%{http_code}" \
              -X PUT "https://melany-sleuthlike-deeply.ngrok-free.dev/api/agents/$BRAINTRUST_AGENT_ID" \
              -H "x-api-key: $BRAINTRUST_API_KEY" \
              -H "Content-Type: application/json" \
              --max-time 120 \
              -d @/tmp/braintrust_prompt_payload.json)
            echo "Prompt — HTTP $HTTP_STATUS: $(cat /tmp/braintrust_prompt_response.json | python3 -m json.tool 2>/dev/null || cat /tmp/braintrust_prompt_response.json)"
            if [ "$HTTP_STATUS" != "200" ]; then echo "Prompt update FAILED."; exit 1; fi
          fi

          # ── Call 3: POST upsert skills ────────────────────────────────────────
          if [ "$HAS_SKILLS" = "true" ]; then
            node -e "
              const fs     = require('fs');
              const result = JSON.parse(fs.readFileSync('/tmp/braintrust_sync_result.json','utf8'));
              process.stdout.write(JSON.stringify({ mode: 'replace', skills: result.skills }));
            " > /tmp/braintrust_skills_payload.json

            echo "Upserting skills..."
            HTTP_STATUS=$(curl -s -o /tmp/braintrust_skills_response.json -w "%{http_code}" \
              -X POST "https://braintrust.ti.trilogy.com/api/agents/$BRAINTRUST_AGENT_ID/expert-skills/upsert" \
              -H "x-api-key: $BRAINTRUST_API_KEY" \
              -H "Content-Type: application/json" \
              --max-time 120 \
              -d @/tmp/braintrust_skills_payload.json)
            echo "Skills — HTTP $HTTP_STATUS: $(cat /tmp/braintrust_skills_response.json | python3 -m json.tool 2>/dev/null || cat /tmp/braintrust_skills_response.json)"
            if [ "$HTTP_STATUS" != "200" ]; then echo "Skills upsert FAILED."; exit 1; fi
          fi

          echo "Sync complete."
